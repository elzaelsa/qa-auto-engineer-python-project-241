name: Python CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Debug coverage config
        run: |
          pwd
          echo "=== pyproject.toml ==="
          cat pyproject.toml
          echo "=== coverage config ==="
          uv run coverage debug config

      - name: Lint
        run: make lint

      - name: Test
        run: make test
  
      - name: Remove old coverage files
        run: |
          rm -f coverage.xml
          rm -f .coverage
          
      - name: Test coverage
        run: make test-coverage    

      - name: Debug coverage
        run: |
          grep -o '<source>[^<]*</source>' coverage.xml
          grep -o 'filename="[^"]*"' coverage.xml | head -10

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}